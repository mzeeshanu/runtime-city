<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dependency Injection Playroom · Runtime City</title>
<meta name="description" content="Learn Dependency Injection by breaking it: weld an engine into a car, then cut a socket. An interactive playroom from Runtime City.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../../assets/playroom.css">
<style>
/* the workshop: a car with an engine bay */
:root{--e-petrol:#C97A34; --e-electric:#2F7FD0; --e-hybrid:#4E9A5B; --e-fake:#8A83A3}
.road{stroke:var(--hair);stroke-width:1.5}
.carbody{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.glass{fill:none;stroke:var(--hair);stroke-width:1.5}
.bay{fill:none;stroke:var(--hair);stroke-width:1.5}
.tire{fill:none;stroke:var(--ink);stroke-width:2}
.hub{fill:none;stroke:var(--hair);stroke-width:1.5}
.spoke{stroke:var(--hair);stroke-width:1.5}
.lamp{fill:var(--accent)}
.weld{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.pin{fill:var(--accent)}
.crack{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.cracked .crack{opacity:1}
.armtxt{font:400 10px var(--mono);fill:var(--muted);text-anchor:middle;letter-spacing:.06em}
.rod{stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round}
#plug{transition:transform .55s cubic-bezier(.2,.9,.3,1.25),opacity .3s}
#plug.out{transform:translateY(-120px);opacity:0}
#armMove{transition:transform .45s ease}
#arm.working #armMove{transform:translateY(-16px)}
.puff{fill:var(--muted);transform-box:fill-box;transform-origin:center;animation:puff 1s ease-out forwards}
.spark{fill:none;stroke:var(--e-electric);stroke-width:2;animation:fade .9s ease-out forwards}
.fxtext{font:400 11px var(--mono);fill:var(--good);text-anchor:middle;animation:rise 1.4s ease-out forwards}
@keyframes puff{from{opacity:.6;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(-46px,-18px) scale(1.9)}}
@keyframes fade{0%,60%{opacity:1}100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}20%{opacity:1}to{opacity:0;transform:translateY(-16px)}}
.spin{transform-box:fill-box;transform-origin:center}
#car.driving{animation:roll 1.2s ease-in-out}
#car.driving .spin{animation:spin .4s linear 3}
#car.shake{animation:shake .45s}
@keyframes roll{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
</style>
</head>
<body>
<div id="playroom"></div>

<script src="../../assets/city.js"></script>
<script src="../../assets/nav.js"></script>
<script src="../../assets/playroom.js"></script>
<script>
const ENG = {
  petrol:  {cls:'PetrolEngine',   label:'Petrol',   color:'var(--e-petrol)',   out:'Vroom. Burning fuel.'},
  electric:{cls:'ElectricEngine', label:'Electric', color:'var(--e-electric)', out:'Whirr. Silent torque.'},
  hybrid:  {cls:'HybridEngine',   label:'Hybrid',   color:'var(--e-hybrid)',   out:'Purr. Battery first, fuel if needed.'},
  fake:    {cls:'FakeEngine',     label:'Fake',     color:'var(--e-fake)',     out:'Start() was called. Recorded it; nothing really ran.'}
};
const IFACE = {cs:'IEngine', java:'Engine', ts:'Engine'};

const STAGE = `
<svg viewBox="0 0 600 280" role="img" aria-label="A car with an engine bay">
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" class="gridline" fill="none"/></pattern></defs>
  <rect width="600" height="280" fill="url(#grid)" opacity=".6"/>
  <line x1="0" y1="248" x2="600" y2="248" class="road"/>
  <g transform="translate(90,0)">
    <g id="car">
      <path class="carbody" d="M0 168 Q0 150 18 150 L60 150 L105 102 Q112 94 124 94 L236 94 Q246 94 253 102 L292 150 L402 150 Q420 150 420 168 L420 202 Q420 216 406 216 L14 216 Q0 216 0 202 Z"/>
      <path class="glass" d="M80 146 L114 106 L172 106 L172 146 Z"/>
      <path class="glass" d="M184 106 L238 106 L270 146 L184 146 Z"/>
      <rect class="lamp" x="413" y="162" width="7" height="11" rx="2"/>
      <rect class="bay" x="298" y="122" width="106" height="78" rx="8"/>
      <text class="tiny" x="351" y="114">engine bay</text>

      <g id="hw">
        <rect id="hwBlock" x="312" y="136" width="78" height="50" rx="4"/>
        <text id="hwLabel" class="fitlbl" x="351" y="166">Petrol</text>
        <path class="weld" d="M300 140 L312 144 L300 148 L312 152 L300 156 L312 160 L300 164 L312 168 L300 172 L312 176 L300 180 L312 184"/>
        <path class="weld" d="M402 140 L390 144 L402 148 L390 152 L402 156 L390 160 L402 164 L390 168 L402 172 L390 176 L402 180 L390 184"/>
      </g>

      <g id="sock">
        <rect class="pin" x="330" y="129" width="7" height="7" rx="1"/>
        <rect class="pin" x="365" y="129" width="7" height="7" rx="1"/>
        <rect class="slot" x="312" y="136" width="78" height="50" rx="4"/>
        <text id="sockLabel" class="slotlbl" x="351" y="166">IEngine</text>
        <g id="plug" class="out">
          <rect id="plugBlock" x="312" y="136" width="78" height="50" rx="4"/>
          <text id="plugLabel" class="fitlbl" x="351" y="166">Petrol</text>
        </g>
      </g>

      <g id="arm"><g id="armMove">
        <text class="armtxt" x="351" y="16">DI CONTAINER</text>
        <path class="rod" d="M351 26 V58 M351 58 L338 76 M351 58 L364 76 M338 76 L332 90 M364 76 L370 90"/>
      </g></g>

      <path class="crack" d="M296 150 L306 166 L295 178 L309 194 L298 212"/>
      <path class="crack" d="M404 126 L391 144 L402 158 L394 170"/>

      <g transform="translate(92,218)"><circle class="tire" r="27"/><g class="spin"><circle class="hub" r="11"/><line class="spoke" x1="-11" y1="0" x2="11" y2="0"/><line class="spoke" x1="0" y1="-11" x2="0" y2="11"/></g></g>
      <g transform="translate(330,218)"><circle class="tire" r="27"/><g class="spin"><circle class="hub" r="11"/><line class="spoke" x1="-11" y1="0" x2="11" y2="0"/><line class="spoke" x1="0" y1="-11" x2="0" y2="11"/></g></g>
    </g>
  </g>
  <g id="fx"></g>
</svg>`;

const NOTES = {
  1:'<b>The highlighted line is the weld.</b> <code>new</code> inside a class means Car decides, forever, which engine it gets.',
  2:'<b>Every change lands inside Car.</b> The class you wanted to leave alone is the one you keep editing.',
  3:'<b>Car depends on an interface now, not a concrete engine.</b> That is the Dependency Inversion Principle; passing the engine in is Dependency Injection.',
  4:'<b>Only the composition root changes.</b> Car stays identical whichever engine you pick, and a test can hand it a fake.',
  5:'<b>A container automates the wiring.</b> Register what fits each socket once, and it builds whole object graphs for you.',
  6:'<b>Interview tip:</b> write the constructor version from step 3 on the whiteboard. It proves you understand DI without any framework.'
};

function files(S){
  const L = S.lang;
  if(S.step <= 2){
    const E = ENG[S.hw].cls;
    const ed = S.edits > 0;
    const weld = ed ? 'bad' : (S.step === 1 ? 'hl' : '');
    const cmt = ed ? '// edited to change engine' : '// welded in';
    const F = {
      cs:[{n:'Car.cs', lines:[['public class Car'],['{'],
          [`    private readonly ${E} _engine = new ${E}();   ${cmt}`, weld],
          ['    public void Drive() => _engine.Start();'],['}']]},
          {n:'Program.cs', lines:[['var car = new Car();'],['car.Drive();']]}],
      java:[{n:'Car.java', lines:[['public class Car {'],
          [`    private final ${E} engine = new ${E}();   ${cmt}`, weld],
          ['    public void drive() { engine.start(); }'],['}']]},
          {n:'Main.java', lines:[['Car car = new Car();'],['car.drive();']]}],
      ts:[{n:'car.ts', lines:[['export class Car {'],
          [`  private engine = new ${E}();   ${cmt}`, weld],
          ['  drive() { this.engine.start(); }'],['}']]},
          {n:'main.ts', lines:[['const car = new Car();'],['car.drive();']]}]
    }[L];
    if(S.tested) F.push({
      cs:{n:'CarTests.cs', lines:[['[Fact]'],['public void Drive_starts_engine()'],['{'],
          ['    var car = new Car();   // no way to pass in a fake','bad'],
          ['    car.Drive();           // starts a REAL engine','bad'],['}']]},
      java:{n:'CarTest.java', lines:[['@Test'],['void driveStartsEngine() {'],
          ['    Car car = new Car();   // no way to pass in a fake','bad'],
          ['    car.drive();           // starts a REAL engine','bad'],['}']]},
      ts:{n:'car.test.ts', lines:[['test("drive starts engine", () => {'],
          ['  const car = new Car();   // no way to pass in a fake','bad'],
          ['  car.drive();             // starts a REAL engine','bad'],['});']]}
    }[L]);
    return F;
  }

  const E = ENG[S.lastReal].cls;
  const container = S.step >= 5, fresh = S.step === 3;
  if(L === 'cs'){
    const F = [
      {n:'IEngine.cs', lines:[['public interface IEngine { void Start(); }', fresh ? 'new' : '']]},
      {n:'Car.cs', lines:[['public class Car'],['{'],['    private readonly IEngine _engine;'],
        ['    public Car(IEngine engine) => _engine = engine;   // the socket', fresh ? 'new' : 'hl'],
        ['    public void Drive() => _engine.Start();'],['}']]},
      container
        ? {n:'Program.cs', lines:[['var builder = Host.CreateApplicationBuilder();'],
            [`builder.Services.AddSingleton<IEngine, ${E}>();   // the only line you change`,'hl'],
            ['builder.Services.AddTransient<Car>();'],['using var host = builder.Build();'],[''],
            ['var car = host.Services.GetRequiredService<Car>();'],['car.Drive();']]}
        : {n:'Program.cs', lines:[['// Composition root: the ONE place that picks an engine'],
            [`var car = new Car(new ${E}());`,'hl'],['car.Drive();']]}
    ];
    if(S.eng === 'fake') F.push({n:'CarTests.cs', lines:[['[Fact]'],['public void Drive_starts_engine()'],['{'],
      ['    var fake = new FakeEngine();','hl'],['    new Car(fake).Drive();','hl'],
      ['    Assert.True(fake.Started);   // 2 ms, no real engine'],['}']]});
    return F;
  }
  if(L === 'java'){
    const F = [
      {n:'Engine.java', lines:[['public interface Engine { void start(); }', fresh ? 'new' : '']]},
      {n:'Car.java', lines:[...(container ? [['@Component','new']] : []),['public class Car {'],
        ['    private final Engine engine;'],
        ['    public Car(Engine engine) { this.engine = engine; }   // the socket', fresh ? 'new' : 'hl'],
        ['    public void drive() { engine.start(); }'],['}']]},
      container
        ? {n:'AppConfig.java', lines:[['@Configuration'],['public class AppConfig {'],['    @Bean'],
            [`    Engine engine() { return new ${E}(); }   // the only line you change`,'hl'],['}'],[''],
            ['// Main.java'],['Car car = context.getBean(Car.class);'],['car.drive();']]}
        : {n:'Main.java', lines:[['// Composition root: the ONE place that picks an engine'],
            [`Car car = new Car(new ${E}());`,'hl'],['car.drive();']]}
    ];
    if(S.eng === 'fake') F.push({n:'CarTest.java', lines:[['@Test'],['void driveStartsEngine() {'],
      ['    FakeEngine fake = new FakeEngine();','hl'],['    new Car(fake).drive();','hl'],
      ['    assertTrue(fake.started);   // 2 ms, no real engine'],['}']]});
    return F;
  }
  const F = [
    {n:'engine.ts', lines:[['export interface Engine { start(): void; }', fresh ? 'new' : '']]},
    {n:'car.ts', lines: container
      ? [['@injectable()','new'],['export class Car {'],
         ['  constructor(@inject("Engine") private engine: Engine) {}   // the socket','hl'],
         ['  drive() { this.engine.start(); }'],['}']]
      : [['export class Car {'],
         ['  constructor(private engine: Engine) {}   // the socket', fresh ? 'new' : 'hl'],
         ['  drive() { this.engine.start(); }'],['}']]},
    container
      ? {n:'main.ts', lines:[[`container.register("Engine", { useClass: ${E} });   // the only line you change`,'hl'],
          ['const car = container.resolve(Car);'],['car.drive();']]}
      : {n:'main.ts', lines:[['// Composition root: the ONE place that picks an engine'],
          [`const car = new Car(new ${E}());`,'hl'],['car.drive();']]}
  ];
  if(S.eng === 'fake') F.push({n:'car.test.ts', lines:[['test("drive starts engine", () => {'],
    ['  const fake = new FakeEngine();','hl'],['  new Car(fake).drive();','hl'],
    ['  expect(fake.started).toBe(true);   // 2 ms, no real engine'],['});']]});
  return F;
}

const P = Playroom({
  district:'Pattern Park',
  title:'Dependency Injection',
  dek:'Stop building your own parts. Start receiving them.',
  steps:['Welded in','Break it','Cut a socket','Plug anything in','The container','Interview check'],
  stage:STAGE,

  state:{hw:'petrol', edits:0, cracked:false, tested:false,
         plugged:false, eng:'petrol', lastReal:'petrol', tried:new Set()},

  story(S, api){
    const fb = api.fb();
    return {
      1:`<h2>A car that builds its own engine</h2><p>This <code>Car</code> creates its own <code>PetrolEngine</code> with <code>new</code>. The engine is welded in. It runs fine, so take it for a drive.</p>`,
      2:`<h2>Now try to change it</h2><p>Two requests arrive. Product wants an <b>electric</b> model. QA wants a <b>unit test</b> that doesn't start a real engine. Try both.</p>${fb}`,
      3:`<h2>Cut a socket</h2><p>Car stops building engines. It <b>asks for one in its constructor</b> instead, and accepts anything that fits the <code>${IFACE[S.lang]}</code> socket. Code outside the car decides what goes in.</p>${fb || '<p>The socket is empty. Hand the car an engine.</p>'}`,
      4:`<h2>Plug anything in</h2><p>Swap engines as often as you like, including a fake one for tests. Car is never edited again. That's the whole payoff.</p>${fb}`,
      5:`<h2>Let the container do the wiring</h2><p>Real apps have hundreds of classes needing parts. A <b>container</b> is the robot arm: register which engine fits the socket once, and it assembles Car for you.</p>${fb || '<p>Steps 3 and 4 were already dependency injection. The container only automates it.</p>'}`,
      6:`<h2>Interview check</h2>${api.quizHTML()}`
    }[S.step];
  },

  controls(S){
    const s = S.step;
    if(s === 1) return `<button class="btn primary" data-a="drive">Drive</button>`;
    if(s === 2) return `<button class="btn primary" data-a="swap">Swap to ${S.hw === 'petrol' ? 'Electric' : 'Petrol'}</button>` +
      `<button class="btn" data-a="test">Write a unit test</button><button class="btn" data-a="drive">Drive</button>`;
    if(s === 3) return S.plugged
      ? `<button class="btn primary" data-a="drive">Drive</button>`
      : `<button class="btn primary" data-a="plugfirst">Pass a PetrolEngine in</button>`;
    return Object.entries(ENG).map(([k, e]) =>
      `<button class="chip" data-e="${k}" aria-pressed="${S.eng === k}"><i style="background:${e.color}"></i>${e.cls}</button>`).join('') +
      `<button class="btn primary" data-a="drive" style="margin-left:auto">Drive</button>`;
  },

  statusLine(S){
    if(S.step <= 2){
      let l = S.edits
        ? `Car edited <b>${S.edits}</b> times<span class="warn"> · engine changes reach into Car</span>`
        : `Car untouched<span class="warn"> · engine welded in, no fake possible</span>`;
      if(S.tested) l += `<span class="warn"> · tests start a real engine</span>`;
      return l;
    }
    const n = S.tried.size || (S.plugged ? 1 : 0);
    return `Car edits since the socket <b>0</b><span class="ok"> · ${n} engine${n === 1 ? '' : 's'} tried · fakes welcome</span>`;
  },

  files,
  note: S => NOTES[S.step],

  onStage(S){
    const s = S.step, id = document.getElementById.bind(document);
    id('hw').style.display = s <= 2 ? '' : 'none';
    id('sock').style.display = s >= 3 ? '' : 'none';
    id('arm').style.display = s >= 5 ? '' : 'none';
    id('car').classList.toggle('cracked', s <= 2 && S.cracked);
    id('hwBlock').setAttribute('fill', ENG[S.hw].color);
    id('hwLabel').textContent = ENG[S.hw].label;
    id('sockLabel').textContent = IFACE[S.lang];
    const e = ENG[S.eng];
    id('plugBlock').setAttribute('fill', e.color);
    id('plugBlock').setAttribute('stroke', S.eng === 'fake' ? 'var(--muted)' : 'none');
    id('plugBlock').setAttribute('stroke-dasharray', S.eng === 'fake' ? '4 3' : '');
    id('plugLabel').textContent = e.label;
    id('plug').classList.toggle('out', !(s >= 3 && S.plugged));
  },

  onStep(S, n){
    if(n === 3){ S.plugged = false; S.eng = 'petrol'; S.tried.clear(); }
    if(n >= 4 && !S.plugged){ S.plugged = true; S.eng = S.lastReal; S.tried.add(S.eng); }
  },

  onClick(S, b, api){
    if(b.dataset.e){
      const k = b.dataset.e;
      plug(S, k, api);
      if(k === 'fake'){
        api.tell('good', '<b>That is a real unit test.</b> It hands Car a fake engine and checks it was started: milliseconds, no fuel, no hardware.');
        api.out('new Car(fake).Drive() → test passed in 2 ms');
      } else {
        api.tell('good', `<b>${ENG[k].cls} is in, and Car didn't change.</b> ${S.step >= 5 ? 'One registration line picked it.' : 'Only the line that builds the car changed.'}`);
        api.out(S.step >= 5 ? `container: ${IFACE[S.lang]} → ${ENG[k].cls}` : `new Car(new ${ENG[k].cls}())`);
      }
      return;
    }
    const a = b.dataset.a;
    if(a === 'drive'){ drive(S, api); return; }
    if(a === 'swap'){
      S.hw = S.hw === 'petrol' ? 'electric' : 'petrol';
      S.edits += 2; S.cracked = true;
      api.tell('bad', '<b>You had to open Car and rewrite it.</b> Every engine change is a Car change, so everything using Car needs retesting.');
      api.out(`edited Car: 2 lines rewritten for ${ENG[S.hw].cls}`);
      const car = api.el('car'); car.classList.remove('shake'); void car.getBBox(); car.classList.add('shake');
      return;
    }
    if(a === 'test'){
      S.tested = true;
      api.tell('bad', '<b>There is no way to give Car a fake engine.</b> The "unit" test starts a real one: slow, flaky, and it cannot check whether Start() was called.');
      api.out(`test run: started a real ${ENG[S.hw].cls} · 1.8 s · nothing to assert`);
      return;
    }
    if(a === 'plugfirst'){
      plug(S, 'petrol', api);
      api.tell('good', '<b>The engine came from outside.</b> <code>new Car(new PetrolEngine())</code> — the car received its engine instead of building it. That is dependency injection.');
      api.out('new Car(new PetrolEngine())');
      return;
    }
    return false;
  },

  reset(S){
    Object.assign(S, {hw:'petrol', edits:0, cracked:false, tested:false,
                      plugged:false, eng:'petrol', lastReal:'petrol', tried:new Set()});
  },

  quiz:[
    {q:'What does it mean to "inject" a dependency?',
     o:['The class creates its dependencies in its own constructor','The dependency is handed to the class from outside','Dependencies are downloaded when the app starts','The class reads a global static instance'], a:1,
     w:'Injection means the class receives what it needs, usually through its constructor. Building it inside with <code>new</code> is the welded version.'},
    {q:'CheckoutService does new StripeClient() inside itself. What should you point out?',
     o:['It will be slower','You cannot swap StripeClient or fake it in tests without editing CheckoutService','It uses more memory','Nothing, that is fine'], a:1,
     w:'The classic interview smell. Accept a payment-client interface in the constructor instead, so tests can pass a fake and you can switch providers.'},
    {q:'Do you need a DI container to do dependency injection?',
     o:['Yes, DI is a framework feature','No. Passing dependencies in by hand is DI; a container only automates the wiring'], a:1,
     w:'Steps 3 and 4 had no container and were already DI. Saying that shows you understand the idea, not just a framework.'},
    {q:'DI is the usual way to follow which SOLID principle?',
     o:['Single Responsibility','Open/Closed','Liskov Substitution','Dependency Inversion'], a:3,
     w:'Dependency Inversion says depend on abstractions, not concrete classes. DI is how the concrete class reaches you.'}
  ],
  soundbite:'"Dependency injection means a class receives its dependencies from outside, usually through its constructor, instead of creating them. Because it depends on an interface, I can swap implementations, like a fake in tests, without changing the class. A container such as Spring or ASP.NET Core just automates that wiring."'
});

function plug(S, k, api){
  S.eng = k; S.plugged = true; S.tried.add(k);
  if(k !== 'fake') S.lastReal = k;
  if(S.step >= 5){
    const arm = api.el('arm');
    arm.classList.add('working');
    setTimeout(() => arm.classList.remove('working'), 500);
  }
  api.replay('plug', 'out');
}

function drive(S, api){
  const kind = S.step <= 2 ? S.hw : S.eng;
  if(S.step >= 3 && !S.plugged){ api.out('Car needs an engine passed in first.'); return; }
  const car = api.el('car');
  car.classList.remove('driving'); void car.getBBox(); car.classList.add('driving');
  setTimeout(() => car.classList.remove('driving'), 1300);
  if(kind === 'petrol') for(let i = 0; i < 4; i++) setTimeout(() => api.fx('fx','circle',{cx:84,cy:203,r:8},'puff'), i * 160);
  if(kind === 'electric' || kind === 'hybrid'){
    api.fx('fx','path',{d:'M468 108 l-8 12 h8 l-8 12'},'spark');
    api.fx('fx','path',{d:'M430 110 l6 10 h-8 l6 10'},'spark');
    if(kind === 'hybrid') for(let i = 0; i < 2; i++) setTimeout(() => api.fx('fx','circle',{cx:84,cy:203,r:6},'puff'), i * 220);
  }
  if(kind === 'fake'){ const t = api.fx('fx','text',{x:441,y:100},'fxtext'); if(t) t.textContent = 'Start() recorded'; }
  api.out(`${ENG[kind].cls}: ${ENG[kind].out}`);
}
</script>
</body>
</html>
